services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:?isi DB_ROOT_PASS di .env}
      MARIADB_DATABASE: ${DB_NAME:-smarthl}
      MARIADB_USER: ${DB_USER:-smarthl}
      MARIADB_PASSWORD: ${DB_PASS:?isi DB_PASS di .env}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASS}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mosquitto:
    # Opsional: hanya ikut bila diminta. Dashboard saja:
    #   docker compose up -d --build
    # Lengkap dengan broker bawaan:
    #   docker compose --profile broker up -d --build
    profiles: ["broker"]
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    ports:
      # MQTT native (ESP). JANGAN lewat Cloudflare proxy; pakai DNS-only AAAA.
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
      # - "8883:8883"  # aktifkan setelah TLS diset di mosquitto.conf
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ./mosquitto/auth:/mosquitto/config/auth:ro
      - mosq-data:/mosquitto/data
      - mosq-log:/mosquitto/log

  # NOTE: dashboard broker grafis (ex-Cedalo) DICABUT — butuh lisensi,
  # UI-nya crash tanpa license. Pengganti: kartu status $SYS di Settings
  # (uptime, klien, pesan, load, retained) — tanpa service tambahan.
  app:
    build: .
    restart: unless-stopped
    ports:
      # Prod: reverse-proxy + TLS di depan, cth https://iot.alfins.my.id -> :5000
      # Bind 0.0.0.0 agar bisa diakses dari LAN (kunci via firewall/Cloudflare).
      - "${APP_PORT:-5000}:5000"
    environment:
      DB_TYPE: mariadb
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-smarthl}
      DB_USER: ${DB_USER:-smarthl}
      DB_PASS: ${DB_PASS:?isi DB_PASS di .env}
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_USER: bridge
      MQTT_PASS: ${BRIDGE_PASSWORD:?isi dari mosquitto/auth/bridge.env}
      RUN_BRIDGE: 1
      SECRET_KEY: ${SECRET_KEY:?isi SECRET_KEY di .env}
      SECURE_COOKIES: ${SECURE_COOKIES:-0}
      TELEMETRY_RETENTION_DAYS: ${TELEMETRY_RETENTION_DAYS:-90}
    depends_on:
      mariadb:
        condition: service_healthy
      # mosquitto TIDAK di-depends_on: ia opsional (profile broker).
      # Bridge retry sendiri bila broker belum/tidak ada.

volumes:
  mariadb-data:
  mosq-data:
  mosq-log:
