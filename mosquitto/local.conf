# Mosquitto config untuk jalan LOKAL tanpa docker (scripts/run-mosquitto.sh).
# Sama seperti mosquitto.conf, beda path data/log saja.
persistence true
persistence_location /home/alfin/devplace/smartHL/mosquitto/data/
log_dest file /home/alfin/devplace/smartHL/mosquitto/mosquitto.log
connection_messages true
log_timestamp true

listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

listener 9001 0.0.0.0
protocol websockets
allow_anonymous true
