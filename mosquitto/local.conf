# Mosquitto config untuk jalan LOKAL tanpa docker (scripts/run-mosquitto.sh).
# Sama seperti mosquitto.conf, beda path data/log saja.
persistence true
persistence_location /home/alfin/devplace/smartHL/mosquitto/data/
log_dest file /home/alfin/devplace/smartHL/mosquitto/mosquitto.log
connection_messages true
log_timestamp true

# Auth global (satu kali saja — mosquitto menolak duplikat per-listener).
# Dibuat via: python3 scripts/sync-mqtt-auth.py (jalankan tiap tambah device)
allow_anonymous false
password_file /home/alfin/devplace/smartHL/mosquitto/auth/passwd
acl_file /home/alfin/devplace/smartHL/mosquitto/auth/acl

listener 1883 0.0.0.0
protocol mqtt

listener 9001 0.0.0.0
protocol websockets
