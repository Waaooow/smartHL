# Mosquitto config untuk CONTAINER (service 'mosquitto' di docker-compose).
# Path di bawah adalah path DI DALAM container (image eclipse-mosquitto).
persistence true
persistence_location /mosquitto/data/
log_dest stdout
connection_messages true
log_timestamp true

# MQTT native (ESP32/ESP8266, backend bridge)
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

# WebSocket (dashboard web / mqtt.js di masa depan)
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true

# --- PROD: mode auth per-device ---
# 1. buat passwd: docker compose exec mosquitto mosquitto_passwd -c /mosquitto/config/passwd <mqtt_id>
# 2. uncomment 3 baris ini + restart:
# allow_anonymous false
# password_file /mosquitto/config/passwd
# acl_file /mosquitto/config/acl
