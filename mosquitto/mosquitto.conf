# Mosquitto config untuk CONTAINER (service 'mosquitto' di docker-compose).
# Path di bawah adalah path DI DALAM container (image eclipse-mosquitto).
persistence true
persistence_location /mosquitto/data/
log_dest stdout
connection_messages true
log_timestamp true

# Auth global (cukup sekali — mosquitto menolak duplikat per-listener).
# Digenerate dari DB: python3 scripts/sync-mqtt-auth.py.
allow_anonymous false
password_file /mosquitto/config/auth/passwd
acl_file /mosquitto/config/auth/acl

# MQTT native (ESP32/ESP8266, backend bridge)
listener 1883 0.0.0.0
protocol mqtt

# WebSocket (dashboard web / mqtt.js di masa depan)
listener 9001 0.0.0.0
protocol websockets
